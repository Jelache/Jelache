name: Agent Instructions Check
on: [push, pull_request]

jobs:
  agent-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chiragdarji/agent-doctor@v1
        with:
          fail-on: critical
          # Structural rules only (no API key needed). To enable the semantic
          # LLM checks, set this to false and add an ANTHROPIC_API_KEY repo secret.
          structural-only: true
